name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name touchmypad --icon touchmypad.ico --add-data "ui.html;." --add-data "touchmypad.ico;." --collect-all webview --hidden-import pystray._win32 touchmypad_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: touchmypad-exe
          path: dist/touchmypad.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/touchmypad.exe
